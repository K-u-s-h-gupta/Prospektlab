name: Deploy to Production

on:
  push:
    branches:
      - production
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: prospektlab-backend
  ECS_CLUSTER: prospektlab-prod
  ECS_SERVICE: prospektlab-backend
  CONTAINER_NAME: prospektlab-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHubActionsSession

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "✅ Image pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Get current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition' > task-definition.json

      - name: Update task definition with new image and environment variables
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          jq \
            --arg IMAGE "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            --arg CORS_ORIGINS "${{ secrets.AMPLIFY_DOMAIN }}" \
            --arg MCP_NSE "${{ secrets.MCP_NSE_URL }}" \
            --arg MCP_FUNDAMENTALS "${{ secrets.MCP_FUNDAMENTALS_URL }}" \
            --arg MCP_RESEARCH "${{ secrets.MCP_RESEARCH_URL }}" \
            --arg MCP_DOCS "${{ secrets.MCP_DOCS_URL }}" \
            --arg MCP_VALUATION "${{ secrets.MCP_VALUATION_URL }}" \
            --arg OPENAI_KEY "${{ secrets.OPENAI_API_KEY }}" \
            '.containerDefinitions[0].image = $IMAGE |
             .containerDefinitions[0].environment |= (
               map(select(
                 .name != "CORS_ORIGINS" and 
                 .name != "MCP_NSE_INDIA_URL" and 
                 .name != "MCP_FUNDAMENTALS_URL" and 
                 .name != "MCP_RESEARCH_URL" and 
                 .name != "MCP_DOCS_URL" and 
                 .name != "MCP_VALUATION_URL" and 
                 .name != "OPENAI_API_KEY"
               )) +
               [
                 {name: "CORS_ORIGINS", value: $CORS_ORIGINS},
                 {name: "MCP_NSE_INDIA_URL", value: $MCP_NSE},
                 {name: "MCP_FUNDAMENTALS_URL", value: $MCP_FUNDAMENTALS},
                 {name: "MCP_RESEARCH_URL", value: $MCP_RESEARCH},
                 {name: "MCP_DOCS_URL", value: $MCP_DOCS},
                 {name: "MCP_VALUATION_URL", value: $MCP_VALUATION},
                 {name: "OPENAI_API_KEY", value: $OPENAI_KEY}
               ]
             ) |
             del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            task-definition.json > new-task-definition.json

      - name: Register new task definition
        id: register-task
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "task-definition-arn=$TASK_DEF_ARN" >> $GITHUB_OUTPUT
          echo "✅ Task definition registered: $TASK_DEF_ARN"

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition ${{ steps.register-task.outputs.task-definition-arn }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
          echo "✅ ECS service updated"

      - name: Wait for deployment to complete
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }}
          echo "✅ Deployment complete!"

      - name: Get service status
        run: |
          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].{
              desiredCount: desiredCount,
              runningCount: runningCount,
              pendingCount: pendingCount,
              taskDefinition: taskDefinition
            }' \
            --output table

      - name: Health check
        run: |
          BACKEND_URL="${{ secrets.BACKEND_URL }}"
          echo "🏥 Running health check on $BACKEND_URL..."

          for i in {1..10}; do
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" $BACKEND_URL/health || echo "000")
            if [ "$RESPONSE" == "200" ]; then
              echo "✅ Backend is healthy!"
              curl -s $BACKEND_URL/health | jq '.'
              break
            else
              echo "   Attempt $i/10: HTTP $RESPONSE"
              sleep 5
            fi
          done

      - name: Trigger Amplify deployment (optional)
        if: github.ref == 'refs/heads/production'
        run: |
          AMPLIFY_APP_ID="${{ secrets.AMPLIFY_APP_ID }}"
          if [ -n "$AMPLIFY_APP_ID" ]; then
            aws amplify start-deployment \
              --app-id $AMPLIFY_APP_ID \
              --branch-name main \
              --region ${{ env.AWS_REGION }}
            echo "✅ Amplify deployment triggered"
          fi

      - name: Notification - Success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              text: `✅ Deployment Successful`,
              blocks: [
                {
                  type: 'section',
                  text: {
                    type: 'mrkdwn',
                    text: `*Deployment Successful* ✅\n*Commit:* <https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*Branch:* ${{ github.ref_name }}\n*Backend:* ${{ secrets.BACKEND_URL }}`
                  }
                }
              ]
            }
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notification - Failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              text: `❌ Deployment Failed`,
              blocks: [
                {
                  type: 'section',
                  text: {
                    type: 'mrkdwn',
                    text: `*Deployment Failed* ❌\n*Commit:* <https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*Branch:* ${{ github.ref_name }}\n*Action:* <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>`
                  }
                }
              ]
            }
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
