version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "📦 Installing dependencies for ProspektLab Frontend..."
        - npm ci
        - echo "🔧 Preparing production config..."
        - |
          if [ -z "$BACKEND_API_URL" ]; then
            echo "⚠️  WARNING: BACKEND_API_URL not set. Using relative paths (may only work with proxy/rewrites)."
            BACKEND_API_URL=""
          else
            echo "✅ Using backend API: $BACKEND_API_URL"
          fi
        - |
          APPINSIGHTS_ENABLED="${APPINSIGHTS_ENABLED:-true}"
          case "$APPINSIGHTS_ENABLED" in
            1|true|TRUE|yes|YES|on|ON) APPINSIGHTS_ENABLED=true ;;
            *) APPINSIGHTS_ENABLED=false ;;
          esac
          APPINSIGHTS_CONNECTION_STRING="${APPINSIGHTS_CONNECTION_STRING:-InstrumentationKey=b4797745-6b7f-4d72-894f-768bdc808d3d;IngestionEndpoint=https://centralindia-0.in.applicationinsights.azure.com/;LiveEndpoint=https://centralindia.livediagnostics.monitor.azure.com/;ApplicationId=980e7ddb-6ef5-46e2-b7ae-bb833f3fc8c8}"
        - |
          # Generate runtime env-config.js (loaded by index.html)
          mkdir -p public
          cat > public/env-config.js << EOF
          window.__BACKEND_URL = "${BACKEND_API_URL}";
          window.__CONFIG__ = {
            apiBase: "${BACKEND_API_URL}",
            environment: "production",
            telemetry: {
              enabled: ${APPINSIGHTS_ENABLED},
              connectionString: "${APPINSIGHTS_CONNECTION_STRING}",
              roleName: "prospektlab-frontend",
              cloudRoleInstance: "amplify"
            }
          };
          console.log("ProspektLab config loaded: backend=" + window.__BACKEND_URL);
          EOF
    build:
      commands:
        - echo "🚀 Building Vite React app for production..."
        - npm run build
        - echo "✅ Build complete. Output in dist/"
    postBuild:
      commands:
        - echo "🎉 Amplify build finished on $(date)"
        - ls -la dist/ || true
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  # Rewrites for SPA + optional API proxy comments (configure in Amplify Console if needed)
  # For API proxy to backend (avoids CORS): add in Amplify App -> Rewrites & redirects:
  #   Source: /api/<*>   Target: https://your-ecs-alb.execute-api.../api/<*>
  #   etc for /auth /chat /portfolio etc. Or use absolute URLs in client (preferred for this setup).
