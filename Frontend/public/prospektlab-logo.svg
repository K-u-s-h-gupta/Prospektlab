      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset=".29" stop-color="#60a5fa"/>
      <stop offset=".68" stop-color="#2563eb" stop-opacity=".5"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
