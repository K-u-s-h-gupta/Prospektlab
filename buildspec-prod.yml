version: 0.2

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:=latest}
      - echo "Repository URI: $REPOSITORY_URI"
      - echo "Image tag: $IMAGE_TAG"

  build:
    commands:
      - echo "Build started on `date`"
      - echo "Building the Docker image with production configuration..."
      - docker build -t $REPOSITORY_URI:$IMAGE_TAG .
      - docker tag $REPOSITORY_URI:$IMAGE_TAG $REPOSITORY_URI:latest
      - echo "Docker image built successfully"

  post_build:
    commands:
      - echo "Build completed on `date`"
      - echo "Pushing the Docker image to ECR..."
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - docker push $REPOSITORY_URI:latest
      - echo "Image pushed successfully: $REPOSITORY_URI:$IMAGE_TAG"
      - printf '[{"name":"'$CONTAINER_NAME'","imageUri":"%s"}]' $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json
      - cat imagedefinitions.json
      - echo "Updating ECS service with new image..."
      - |
        aws ecs update-service \
          --cluster $ECS_CLUSTER \
          --service $ECS_SERVICE \
          --force-new-deployment \
          --region $AWS_DEFAULT_REGION
      - echo "✅ Deployment initiated. Monitor progress in ECS console."

artifacts:
  files:
    - imagedefinitions.json
  name: BuildArtifact

cache:
  paths:
    - '/root/.cache/pip/**/*'
    - '/root/.docker/**/*'

environment_variables:
  - name: AWS_DEFAULT_REGION
    value: us-east-1
  - name: AWS_ACCOUNT_ID
    value: "YOUR_AWS_ACCOUNT_ID"
  - name: IMAGE_REPO_NAME
    value: prospektlab-backend
  - name: CONTAINER_NAME
    value: prospektlab-backend
  - name: ECS_CLUSTER
    value: prospektlab-prod
  - name: ECS_SERVICE
    value: prospektlab-backend

logs:
  - '/var/log/docker.log'
