AWSTemplateFormatVersion: '2010-09-09'
Description: AWS ECS Fargate Backend Stack with ALB and CodeBuild for FinAgent.

Parameters:
  ProjectName:
    Type: String
    Default: finagent-backend
    Description: Name of the project.

Resources:
  # --- Network Configuration ---
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-igw'

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-subnet-a'

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [ 1, !GetAZs '' ]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-subnet-b'

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-rt'

  Route:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetA
      RouteTableId: !Ref RouteTable

  SubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetB
      RouteTableId: !Ref RouteTable

  # --- Security Groups ---
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow public HTTP traffic to ALB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow traffic from ALB to ECS and outbound traffic
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref ALBSecurityGroup

  # --- Application Load Balancer ---
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${ProjectName}-alb'
      Scheme: internet-facing
      Subnets:
        - !Ref SubnetA
        - !Ref SubnetB
      SecurityGroups:
        - !Ref ALBSecurityGroup

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ProjectName}-tg'
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VPC

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP

  # --- ECS Infrastructure ---
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref ProjectName

  ECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref ProjectName

  SourceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'finagent-backend-src-${AWS::Region}-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled

  # --- IAM Roles ---
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  ECSTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref ProjectName
      Cpu: '2048'         # 2 vCPU (recommended for Chromium + concurrent agents + search)
      Memory: '4096'      # 4 GB Memory (stable for production workloads)
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !Ref ECSTaskExecutionRole
      TaskRoleArn: !Ref ECSTaskRole
      ContainerDefinitions:
        - Name: backend
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ECRRepository}:latest'
          PortMappings:
            - ContainerPort: 8080
          Environment:
            # Non-sensitive configuration (override via CI/CD or console for production values)
            - Name: PROSPEKTLAB_ENV
              Value: production
            - Name: CORS_ORIGINS
              Value: "*"
            - Name: FINAGENT_SEARXNG_URL
              Value: ""  # Optional: Set to your SearXNG URL (e.g. http://internal-alb-searxng:8888) for private search. Leave empty -> DDG+Bing fallback (NOW FULLY SUPPORTED & BUG-FIXED for ECS)
            - Name: MCP_DISCOVERY_URL
              Value: ""
            - Name: MCP_QUANT_URL
              Value: ""
            # Secrets below must be updated after stack creation or via deployment workflow (do not commit real keys)
            - Name: OPENAI_API_KEY
              Value: "REPLACE_WITH_YOUR_OPENAI_KEY"
            - Name: APPINSIGHTS_ENABLED
              Value: "false"
            - Name: APPINSIGHTS_CONNECTION_STRING
              Value: ""
            - Name: APPINSIGHTS_ROLE_NAME
              Value: "prospektlab-backend"
            - Name: TELEMETRY_BURNER_ENABLED
              Value: "false"
            - Name: TELEMETRY_BURNER_INTERVAL_S
              Value: "5"
            - Name: TELEMETRY_BURNER_BURST_SIZE
              Value: "12"
            - Name: TELEMETRY_BURNER_PAYLOAD_KB
              Value: "12"
            - Name: TELEMETRY_BURNER_SESSION_FANOUT
              Value: "3"
            - Name: TELEMETRY_BURNER_EXCEPTION_EVERY
              Value: "5"
            - Name: TELEMETRY_BURNER_REPLAY_LIMIT
              Value: "5000"
            - Name: TELEMETRY_BURNER_ROTATE_AFTER_CYCLES
              Value: "60"
            - Name: SUPABASE_URL
              Value: ""
            - Name: SUPABASE_KEY
              Value: ""
            - Name: TAVILY_API_KEY
              Value: ""
            - Name: ACS_EMAIL_CONNECTION_STRING
              Value: ""
            - Name: ACS_EMAIL_FROM
              Value: "auth@notify.prospektlab.com"
            - Name: ACS_EMAIL_SENDER_USERNAME
              Value: "auth"
            - Name: ACS_EMAIL_DOMAIN
              Value: "notify.prospektlab.com"
            - Name: ACS_SMS_CONNECTION_STRING
              Value: ""
            - Name: ACS_SMS_FROM
              Value: ""
            - Name: AUTH_SMS_DEFAULT_COUNTRY_CODE
              Value: "+91"
            - Name: SUPABASE_JWT_SECRET
              Value: ""
            - Name: SUPABASE_DB_URL
              Value: ""
            - Name: IKG_BACKEND
              Value: "postgres"
            - Name: IKG_DATABASE_URL
              Value: ""
            - Name: DATABASE_URL
              Value: ""
            - Name: AZURE_DI_ENDPOINT
              Value: ""
            - Name: AZURE_DI_KEY
              Value: ""
            - Name: FINAGENT_PIPELINE_LOG_DIR
              Value: "/tmp/pipeline_logs"
            - Name: FINAGENT_REPORT_CACHE_DIR
              Value: "/tmp/annual_reports"
            - Name: FINAGENT_ANNUAL_REPORT_EXTRACT_MODE
              Value: "metadata_only"
            - Name: FINAGENT_GRAPHRAG_CACHE
              Value: "/tmp/graphrag"
            - Name: IKG_SCHEDULER_LOCK_TTL_MINUTES
              Value: "240"
            - Name: MEMORY_BACKEND
              Value: "prospekt_tiered"
            - Name: MEMORY_DATABASE_URL
              Value: ""  # Set to the dedicated private Postgres memory database URL.
            - Name: MEMORY_VECTOR_DIM
              Value: "1536"
            - Name: MEMORY_EMBEDDINGS_ENABLED
              Value: "false"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref CloudWatchLogsGroup
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: ecs

  ECSSchedulerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-ikg-scheduler'
      Cpu: '1024'
      Memory: '2048'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !Ref ECSTaskExecutionRole
      TaskRoleArn: !Ref ECSTaskRole
      ContainerDefinitions:
        - Name: ikg-scheduler
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ECRRepository}:latest'
          Command:
            - python
            - -m
            - finagent.ikg.pipeline.scheduler
          Environment:
            - Name: PROSPEKTLAB_ENV
              Value: production
            - Name: SUPABASE_URL
              Value: ""
            - Name: SUPABASE_KEY
              Value: ""
            - Name: SUPABASE_JWT_SECRET
              Value: ""
            - Name: SUPABASE_DB_URL
              Value: ""
            - Name: IKG_BACKEND
              Value: "postgres"
            - Name: IKG_DATABASE_URL
              Value: ""
            - Name: DATABASE_URL
              Value: ""
            - Name: AZURE_DI_ENDPOINT
              Value: ""
            - Name: AZURE_DI_KEY
              Value: ""
            - Name: MCA_COMPANY_MASTER_CSV
              Value: "data/company_master_data_2026-06-01.csv"
            - Name: FINAGENT_PIPELINE_LOG_DIR
              Value: "/tmp/pipeline_logs"
            - Name: FINAGENT_REPORT_CACHE_DIR
              Value: "/tmp/annual_reports"
            - Name: FINAGENT_ANNUAL_REPORT_EXTRACT_MODE
              Value: "metadata_only"
            - Name: FINAGENT_GRAPHRAG_CACHE
              Value: "/tmp/graphrag"
            - Name: IKG_SCHEDULER_LOCK_TTL_MINUTES
              Value: "240"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref CloudWatchLogsGroup
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: ikg-scheduler

  CloudWatchLogsGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${ProjectName}'
      RetentionInDays: 7

  ECSService:
    Type: AWS::ECS::Service
    DependsOn: ALBListener
    Properties:
      ServiceName: !Ref ProjectName
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref ECSTaskDefinition
      LaunchType: FARGATE
      DesiredCount: 0 # Start with 0. CodeBuild will set this to 1 after image is pushed.
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref ECSSecurityGroup
          Subnets:
            - !Ref SubnetA
            - !Ref SubnetB
      LoadBalancers:
        - ContainerName: backend
          ContainerPort: 8080
          TargetGroupArn: !Ref ALBTargetGroup

  ECSSchedulerService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub '${ProjectName}-ikg-scheduler'
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref ECSSchedulerTaskDefinition
      LaunchType: FARGATE
      DesiredCount: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref ECSSecurityGroup
          Subnets:
            - !Ref SubnetA
            - !Ref SubnetB

  # --- CodeBuild Setup ---
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - ecr:GetAuthorizationToken
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchCheckLayerAvailability
                  - ecs:DescribeTaskDefinition
                  - ecs:RegisterTaskDefinition
                  - ecs:UpdateService
                  - ecs:DescribeServices
                  - iam:PassRole
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: '*'

  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${ProjectName}-build'
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: AWS_DEFAULT_REGION
            Value: !Ref 'AWS::Region'
          - Name: AWS_ACCOUNT_ID
            Value: !Ref 'AWS::AccountId'
          - Name: IMAGE_REPO_NAME
            Value: !Ref ECRRepository
          - Name: ECS_CLUSTER
            Value: !Ref ECSCluster
          - Name: ECS_SERVICE
            Value: !Ref ECSService
      Source:
        Type: S3
        Location: !Sub '${SourceBucket}/backend.zip'
      TimeoutInMinutes: 20

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${ProjectName}-api-gw'
      ProtocolType: HTTP

  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      IntegrationUri: !Sub 'http://${ALB.DNSName}'
      PayloadFormatVersion: '1.0'

  ApiGatewayRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: '$default'
      Target: !Sub 'integrations/${Integration}'

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true

Outputs:
  ALBDNS:
    Description: Public DNS of the ALB
    Value: !GetAtt ALB.DNSName
  HttpApiUrl:
    Description: HTTPS URL of the API Gateway HTTP API proxying to Fargate backend
    Value: !GetAtt HttpApi.ApiEndpoint
  SourceBucketName:
    Description: S3 Source Bucket Name
    Value: !Ref SourceBucket
  CodeBuildProjectName:
    Description: CodeBuild Project Name
    Value: !Ref CodeBuildProject
